<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380">
  <defs>
    <clipPath id="sc">
      <path d="M160,30 L285,57 L285,226 Q285,314 160,348 Q35,314 35,226 L35,57 Z"/>
    </clipPath>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e490"/>
      <stop offset="40%" stop-color="#c8a030"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </linearGradient>
    <linearGradient id="skybg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d0b0"/>
      <stop offset="100%" stop-color="#e8e0c4"/>
    </linearGradient>
  </defs>

  <!-- Gold outer shield -->
  <path d="M160,6 L312,36 L312,228 Q312,338 160,380 Q8,338 8,228 L8,36 Z"
        fill="url(#gg)"/>

  <!-- Black inner shield -->
  <path d="M160,17 L300,44 L300,226 Q300,328 160,368 Q20,328 20,226 L20,44 Z"
        fill="#0d0d0d"/>

  <!-- Scene background -->
  <path d="M160,30 L285,57 L285,226 Q285,314 160,348 Q35,314 35,226 L35,57 Z"
        fill="url(#skybg)"/>

  <!-- Buildings left -->
  <g clip-path="url(#sc)" fill="#9e9880" opacity="0.6">
    <rect x="35" y="152" width="18" height="86"/>
    <rect x="47" y="122" width="14" height="116"/>
    <rect x="56" y="140" width="18" height="98"/>
    <rect x="69" y="105" width="13" height="133"/>
    <rect x="77" y="130" width="17" height="108"/>
    <rect x="89" y="148" width="11" height="90"/>
    <rect x="96" y="118" width="9" height="120"/>
  </g>

  <!-- Buildings right -->
  <g clip-path="url(#sc)" fill="#9e9880" opacity="0.6">
    <rect x="267" y="152" width="18" height="86"/>
    <rect x="259" y="122" width="14" height="116"/>
    <rect x="246" y="140" width="18" height="98"/>
    <rect x="238" y="105" width="13" height="133"/>
    <rect x="226" y="130" width="17" height="108"/>
    <rect x="215" y="148" width="11" height="90"/>
    <rect x="215" y="118" width="9" height="120"/>
  </g>

  <!-- Ground/floor -->
  <g clip-path="url(#sc)">
    <rect x="35" y="232" width="250" height="116" fill="#c8c0a0" opacity="0.5"/>
    <rect x="35" y="228" width="250" height="8" fill="#a89878" opacity="0.6"/>
  </g>

  <!-- Grand piano body -->
  <g clip-path="url(#sc)">
    <!-- Piano main body -->
    <path d="M100,190 Q160,162 220,186 L222,226 Q160,220 96,226 Z" fill="#111"/>
    <!-- Lid open -->
    <path d="M108,188 Q178,132 226,154 L222,184 Q176,165 105,190 Z" fill="#1c1c1c"/>
    <!-- Legs -->
    <rect x="110" y="224" width="8" height="22" fill="#111" rx="1"/>
    <rect x="156" y="226" width="8" height="20" fill="#111" rx="1"/>
    <rect x="202" y="224" width="8" height="22" fill="#111" rx="1"/>
    <!-- Piano keys hint -->
    <rect x="108" y="216" width="112" height="8" fill="#1a1a1a" rx="1"/>
    <rect x="112" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="120" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="134" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="142" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="150" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="164" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
    <rect x="172" y="217" width="4" height="5" fill="#2a2a2a" rx="0.5"/>
  </g>

  <!-- Left worker -->
  <g clip-path="url(#sc)" fill="#111">
    <!-- head -->
    <circle cx="81" cy="152" r="12"/>
    <!-- cap -->
    <rect x="66" y="144" width="30" height="6" rx="3" fill="#0d0d0d"/>
    <rect x="68" y="139" width="26" height="8" rx="4" fill="#111"/>
    <!-- torso -->
    <path d="M72,164 Q68,192 65,218 L76,218 L81,196 L86,218 L97,218 Q94,192 90,164 Z"/>
    <!-- pushing arm right -->
    <path d="M90,168 Q106,163 113,176 L108,179 Q103,169 88,172 Z"/>
    <!-- other arm -->
    <path d="M72,168 Q66,178 70,190 L76,188 Q73,178 74,170 Z"/>
    <!-- legs -->
    <path d="M65,218 Q61,235 58,252 L68,252 L74,234 Z"/>
    <path d="M97,218 Q99,235 101,252 L91,252 L87,234 Z"/>
  </g>

  <!-- Right worker (mirrored) -->
  <g clip-path="url(#sc)" fill="#111">
    <!-- head -->
    <circle cx="239" cy="152" r="12"/>
    <!-- cap -->
    <rect x="224" y="144" width="30" height="6" rx="3" fill="#0d0d0d"/>
    <rect x="226" y="139" width="26" height="8" rx="4" fill="#111"/>
    <!-- torso -->
    <path d="M230,164 Q226,192 223,218 L234,218 L239,196 L244,218 L255,218 Q252,192 248,164 Z"/>
    <!-- pushing arm left -->
    <path d="M230,168 Q214,163 207,176 L212,179 Q217,169 232,172 Z"/>
    <!-- other arm -->
    <path d="M248,168 Q254,178 250,190 L244,188 Q247,178 246,170 Z"/>
    <!-- legs -->
    <path d="M223,218 Q221,235 219,252 L229,252 L235,234 Z"/>
    <path d="M255,218 Q257,235 259,252 L249,252 L245,234 Z"/>
  </g>

  <!-- Ribbon banner ears -->
  <path d="M20,234 L2,258 L20,282" fill="#1c1c1c"/>
  <path d="M300,234 L318,258 L300,282" fill="#1c1c1c"/>

  <!-- Main ribbon band -->
  <rect x="20" y="234" width="280" height="48" fill="#111"/>

  <!-- Gold border lines -->
  <line x1="20" y1="236" x2="300" y2="236" stroke="#c8a030" stroke-width="1.8"/>
  <line x1="20" y1="280" x2="300" y2="280" stroke="#c8a030" stroke-width="1.8"/>

  <!-- ÖREG és INCZE -->
  <text x="160" y="269" text-anchor="middle" fill="white"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="bold" letter-spacing="0.5">ÖREG és INCZE</text>

  <!-- Sub-ribbon -->
  <path d="M74,280 L246,280 L240,304 L80,304 Z" fill="#181818"/>
  <line x1="74" y1="280" x2="246" y2="280" stroke="#c8a030" stroke-width="1"/>

  <!-- Diamond ornament -->
  <polygon points="160,276 166,282 160,288 154,282" fill="#c8a030"/>

  <!-- ZONGORASZÁLLÍTÁS -->
  <text x="160" y="297" text-anchor="middle" fill="#e8d080"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" font-weight="bold" letter-spacing="2.2">ZONGORASZÁLLÍTÁS</text>
</svg>
